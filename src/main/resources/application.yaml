spring:
  application:
    name: start-umami-backend
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:14332/start-umami?user=start-umami&password=start-umami
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 25
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 16
        jdbc:
          batch_size: 16
        order_inserts: true
        order_updates: true
  security:
    oauth2:
      resourceserver:
        jwt:
          audiences:
            - start-umami

springdoc:
  api-docs:
    enabled: true
    path: /api/openapi
  swagger-ui:
    enabled: true
    path: /api/swagger-ui
    url: /api/openapi
    order: ["Project", "Dashboard", "GraphCategory", "Graph", "Query", "Sidegroup", "Cohort", "CohortEntry"]

server:
  http2:
    enabled: true
  port: 8086

management:
  endpoints:
    web:
      base-path: /internal
      exposure:
        include: info, health, metrics, prometheus

logging:
  level:
    root: WARN
    org.springframework.web: WARN
    no.nav.reops: INFO
    org.flywaydb: INFO

---
# jwk-set-uri (not issuer-uri): local dev only, checked in for mock-oauth2-server.
# issuer-uri would enforce an exact `iss` claim match, but mock-oauth2-server derives
# `iss` from whatever Host header the token requester used, which doesn't stay
# consistent across host-run backend, docker-compose backend, and innblikk-frontend's
# local proxy. jwk-set-uri only verifies signature + audience, sidestepping that.
#
# Scoped to "!kubernetes" (i.e. active whenever the kubernetes profile is NOT active)
# rather than being set unconditionally above: @ConditionalOnProperty on jwk-set-uri
# treats ANY present value - including an empty string - as "set", and takes priority
# over issuer-uri. So if this were unconditional, application-kubernetes.yaml would
# have no way to override it back to issuer-uri-based validation, and every deployed
# environment would silently try to validate JWTs against this literal localhost URL.
spring:
  config:
    activate:
      on-profile: "!kubernetes"
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8080/issueissue/jwks

