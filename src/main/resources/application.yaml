spring:
  application:
    name: start-umami-backend
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:14332/start-umami?user=start-umami&password=start-umami
    driver-class-name: org.postgresql.Driver
    hikari:
      housekeeping-period-ms: 30000
      thread-starvation-threshold: 180000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          audiences:
            - start-umami
          issuer-uri: http://localhost:8080/issueissue

springdoc:
  api-docs:
    enabled: true
    path: /api/openapi
  swagger-ui:
    enabled: true
    path: /api/swagger-ui
    url: /api/openapi

server:
  http2:
    enabled: true
  port: 8086

management:
  endpoints:
    web:
      base-path: /internal
      exposure:
        include: info, health, metrics, prometheus
