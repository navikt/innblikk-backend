spring:
  datasource:
    url: ${NAIS_DATABASE_START_UMAMI_BACKEND_START_UMAMI_JDBC_URL} #start-umami-backend
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AZURE_OPENID_CONFIG_ISSUER}
          audiences:
            - ${AZURE_APP_CLIENT_ID}

logging:
  structured:
    format:
      console: logstash