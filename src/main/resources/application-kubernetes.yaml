spring:
  datasource:
    url: ${NAIS_DATABASE_REOPS_INNBLIKK_BACKEND_INNBLIKK_JDBC_URL}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AZURE_OPENID_CONFIG_ISSUER}
          audiences:
            - ${AZURE_APP_CLIENT_ID}

server:
  port: 8080

logging:
  structured:
    format:
      console: logstash
  level:
    root: WARN
    org.springframework.web: WARN
    no.nav.reops: INFO