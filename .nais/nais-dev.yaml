apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: start-umami-backend
  namespace: team-researchops
  labels:
    team: team-researchops
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  image: "{{ image }}"
  port: 8080
  liveness:
    path: /internal/health
    initialDelay: 30
  readiness:
    path: /internal/health
    initialDelay: 5
  replicas:
    min: 1
    max: 3
    cpuThresholdPercentage: 50
  ingresses:
    - "https://innblikk-backend.ansatt.dev.nav.no"
    - "https://innblikk-backend.intern.dev.nav.no"
  prometheus:
    enabled: true
    path: /internal/prometheus
  resources:
    limits:
      memory: 524Mi
    requests:
      cpu: "400m"
      memory: 256Mi
  gcp:
    sqlInstances:
      - type: POSTGRES_18
        tier: db-custom-1-4096
        diskType: SSD
        diskSize: 10
        diskAutoresize: true
        autoBackupHour: 3
        databases:
          - name: start-umami
        maintenance:
          day: 1
          hour: 4
        cascadingDelete: false
  azure:
    application:
      enabled: true
      allowAllUsers: true
      tenant: nav.no
    sidecar:
      enabled: true
      autoLogin: false
  accessPolicy:
    inbound:
      rules:
        - application: umami-start
  # DEV-ONLY. Backs the static-token auth escape hatch in LocalDevTokenAuthFilter.kt, so a
  # contributor without naisdevice/Azure AD access (e.g. a designer) can run innblikk-frontend
  # fully locally against this real dev backend. Deliberately NOT present in nais-prod.yaml —
  # that absence is the primary safety gate (see LocalDevTokenAuthFilter.kt for the full
  # threat-model writeup and the additional NAIS_CLUSTER_NAME runtime guard).
  #
  # Create/rotate the underlying secret once via:
  #   kubectl create secret generic umami-backend-dev-local-token \
  #     --from-literal=DEV_LOCAL_AUTH_TOKEN="$(openssl rand -hex 32)" \
  #     -n team-researchops --dry-run=client -o yaml | kubectl apply -f -
  # Then share the value with whoever needs it via a secure channel (password manager vault),
  # never Slack/email/git. To revoke: rotate the secret value and redeploy.
  envFrom:
    - secret: umami-backend-dev-local-token
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: kubernetes
    - name: JAVA_TOOL_OPTIONS
      value: >-
        -XX:+UseZGC
        -XX:MaxRAMPercentage=70
        -XX:InitialRAMPercentage=50
        -XX:+ExitOnOutOfMemoryError