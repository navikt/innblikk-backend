apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: start-umami-backend
  namespace: team-researchops
  labels:
    team: team-researchops
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  image: "{{ image }}"
  port: 8080
  liveness:
    path: /internal/health
    initialDelay: 30
  readiness:
    path: /internal/health
    initialDelay: 5
  replicas:
    min: 1
    max: 3
    cpuThresholdPercentage: 50
  ingresses:
    - "https://innblikk-backend.ansatt.dev.nav.no"
    - "https://innblikk-backend.intern.dev.nav.no"
  prometheus:
    enabled: true
    path: /internal/prometheus
  resources:
    limits:
      memory: 524Mi
    requests:
      cpu: "400m"
      memory: 256Mi
  gcp:
    sqlInstances:
      - type: POSTGRES_18
        tier: db-custom-1-4096
        diskType: SSD
        diskSize: 10
        diskAutoresize: true
        autoBackupHour: 3
        databases:
          - name: start-umami
        maintenance:
          day: 1
          hour: 4
        cascadingDelete: false
  azure:
    application:
      enabled: true
      allowAllUsers: true
      tenant: nav.no
    sidecar:
      enabled: true
      autoLogin: false
  accessPolicy:
    inbound:
      rules:
        - application: umami-start
  # DEV-ONLY static-token auth escape hatch (LocalDevTokenAuthFilter.kt) — never present in
  # nais-prod.yaml, that absence is the primary safety gate. See
  # https://github.com/navikt/innblikk-backend/pull/33 for the full rationale, and
  # innblikk-frontend's README ("Opprette/rotere BACKEND_TOKEN") for how to create/rotate the
  # secret via the Nais console (most team members lack kubectl secrets access here).
  envFrom:
    - secret: umami-backend-dev-local-token
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: kubernetes
    - name: JAVA_TOOL_OPTIONS
      value: >-
        -XX:+UseZGC
        -XX:MaxRAMPercentage=70
        -XX:InitialRAMPercentage=50
        -XX:+ExitOnOutOfMemoryError