apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: reops-innblikk-backend
  namespace: team-researchops
  labels:
    team: team-researchops
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  image: "{{ image }}"
  port: 8080
  liveness:
    path: /internal/health
    initialDelay: 30
  readiness:
    path: /internal/health
    initialDelay: 5
  replicas:
    min: 1
    max: 4
    cpuThresholdPercentage: 50
  ingresses:
    - "https://innblikk-backend.ansatt.nav.no"
    - "https://innblikk-backend.intern.nav.no"
  prometheus:
    enabled: true
    path: /internal/prometheus
  resources:
    limits:
      memory: 524Mi
    requests:
      cpu: "400m"
      memory: 256Mi
  gcp:
    sqlInstances:
      - type: POSTGRES_18
        tier: db-custom-1-4096
        diskType: SSD
        diskSize: 10
        diskAutoresize: true
        autoBackupHour: 3
        databases:
          - name: innblikk
        maintenance:
          day: 1
          hour: 4
        cascadingDelete: false
  azure:
    application:
      enabled: true
      allowAllUsers: true
      tenant: nav.no
    sidecar:
      enabled: true
      autoLogin: false
  accessPolicy:
    inbound:
      rules:
        - application: reops-innblikk-frontend
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: kubernetes
    - name: JAVA_TOOL_OPTIONS
      value: >-
        -XX:+UseZGC
        -XX:MaxRAMPercentage=70
        -XX:InitialRAMPercentage=50
        -XX:+ExitOnOutOfMemoryError