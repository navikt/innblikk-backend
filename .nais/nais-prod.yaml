apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: start-umami-backend
  namespace: team-researchops
  labels:
    team: team-researchops
spec:
  image: "{{ image }}"
  port: 8080
  liveness:
    path: /internal/health
    initialDelay: 30
  readiness:
    path: /internal/health
    initialDelay: 5
  replicas:
    min: 1
    max: 2
    cpuThresholdPercentage: 80
  ingresses:
    - "https://start-umami-backend.ansatt.nav.no"
    - "https://start-umami-backend.intern.nav.no"
  prometheus:
    enabled: true
    path: /internal/prometheus
  resources:
    limits:
      cpu: "1000m"
      memory: 1024Mi
    requests:
      cpu: "200m"
      memory: 512Mi
  gcp:
    sqlInstances:
      - type: POSTGRES_18
        tier: db-custom-1-4096
        diskType: SSD
        diskSize: 10
        diskAutoresize: true
        autoBackupHour: 3
        databases:
          - name: start-umami
        maintenance:
          day: 1
          hour: 4
        cascadingDelete: false
  azure:
    application:
      enabled: true
      allowAllUsers: true
      tenant: nav.no
    sidecar:
      enabled: true
      autoLogin: true
      autoLoginIgnorePaths:
        - /internal/
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: kubernetes
    - name: JAVA_TOOL_OPTIONS
      value: >-
        -XX:+UseZGC
        -XX:MaxRAMPercentage=70
        -XX:InitialRAMPercentage=50
        -XX:+ExitOnOutOfMemoryError