name: "Deploy Prod (Manual)"
run-name: "Deploy Prod (Manual)"

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image to deploy (copy from dev deploy run output)"
        required: true
        type: string

concurrency:
  group: deploy-prod-manual
  cancel-in-progress: false

jobs:
  deploy-application-prod:
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Deploy application to Prod
        uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: prod-gcp
          RESOURCE: .nais/nais-prod.yaml
          VAR: image=${{ github.event.inputs.image }}

      - name: Create deployment tag
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG_NAME="prod-$(date -u +'%Y.%m.%d-%H%M%S')"
          git tag -a "$TAG_NAME" -m "Production deployment of ${{ github.event.inputs.image }}"
          git push origin "$TAG_NAME"
