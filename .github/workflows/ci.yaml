name: "CI"

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '.compose/**'
  workflow_call:
    inputs:
      ref:
        description: 'Branch, tag or commit to check. Defaults to the triggering commit.'
        type: string
        default: ''

jobs:
  test:
    name: "Run tests"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew clean build --build-cache
