name: "CI"
run-name: "CI @ ${{ github.ref_name }}"

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '.compose/**'
  workflow_call:

jobs:
  test:
    name: "Run tests"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew clean build --build-cache
